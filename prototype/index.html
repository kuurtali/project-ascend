<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Ascend — Skill Tree Prototipi</title>
<style>
:root{
  --bg:#0b0d12; --panel:#11141b; --panel2:#161a23; --line:#242a36;
  --txt:#e6e8ee; --dim:#8b93a5; --dim2:#5b6376;
  --bronze:#cd7f32; --silver:#c4c9d4; --gold:#f5c542; --master:#a855f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:18px;padding:10px 16px;
  background:linear-gradient(180deg,#141821,#0f1219);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{font-weight:700;letter-spacing:.14em;font-size:13px;color:#fff}
.logo span{color:var(--gold)}
.lvl{display:flex;align-items:center;gap:10px}
.lvlbadge{width:38px;height:38px;border-radius:10px;background:conic-gradient(var(--gold),#8b5cf6,var(--gold));
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#0b0d12}
.xpwrap{width:220px}
.xpbar{height:6px;background:#20252f;border-radius:99px;overflow:hidden}
.xpfill{height:100%;background:linear-gradient(90deg,#f5c542,#a855f7);width:0%;transition:width .4s}
.xptxt{font-size:11px;color:var(--dim);margin-top:3px}
.hstats{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.hstat{text-align:center;min-width:56px}
.hstat b{display:block;font-size:16px}
.hstat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.hbtns{display:flex;gap:6px}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}
button:hover{background:#1e2431;border-color:#39424f}
button.pri{background:#f5c542;color:#0b0d12;border-color:#f5c542;font-weight:600}
button.pri:hover{background:#ffd85e}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
aside{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
.sec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  margin:14px 0 7px}
.sec:first-child{margin-top:0}
input[type=text],input[type=number],select{width:100%;background:#0d1016;border:1px solid var(--line);
  color:var(--txt);border-radius:7px;padding:7px 9px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;cursor:pointer;color:var(--dim)}
.chk input{accent-color:#f5c542}
.chk.on{color:var(--txt)}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.catcount{margin-left:auto;font-size:10px;color:var(--dim2)}

/* ---------- canvas ---------- */
#stage{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(1200px 700px at 25% 10%,#141a26 0%,#0b0d12 70%);cursor:grab}
#stage.drag{cursor:grabbing}
#viewport{position:absolute;top:0;left:0;transform-origin:0 0}
.bandlabel{font-size:11px;fill:var(--dim2);letter-spacing:.12em;text-transform:uppercase}
.bandrect{fill:#ffffff05}
.edge{fill:none;stroke:#2b323f;stroke-width:1.4}
.edge.act{stroke:#f5c54288;stroke-width:2}
.edge.gps{stroke:#22d3ee;stroke-width:2.6}
.node rect{stroke-width:1.5;rx:8}
.node text{font-size:11px;dominant-baseline:middle;pointer-events:none}
.node{cursor:pointer}
.node.locked rect{fill:#13161d;stroke:#242a36}
.node.locked text{fill:#4e5666}
.node.open rect{fill:#151a24}
.node.open text{fill:#e6e8ee}
.node.m0 rect{fill:#2a1d10}
.node.m1 rect{fill:#232732}
.node.m2 rect{fill:#33290c}
.node.m3 rect{fill:#2a1740}
.node.sel rect{stroke-width:3}
.node.dim{opacity:.16}
.node.gps rect{stroke:#22d3ee;stroke-width:2.5}
.tierbadge{font-size:9px;fill:#8b93a5}
.bosscrown{font-size:12px}
.medal{font-size:10px}
#hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim2);
  background:#0b0d12cc;padding:5px 9px;border-radius:6px;border:1px solid var(--line)}
#zoombtns{position:absolute;right:12px;bottom:10px;display:flex;gap:5px}

/* ---------- detail ---------- */
#detail{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:0}
#detail .empty{padding:30px 18px;color:var(--dim2);font-size:13px;text-align:center}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dhead h2{margin:0 0 4px;font-size:17px}
.dmeta{font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:#1b2029;border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:10.5px}
.dbody{padding:14px 16px}
.dsec{margin-bottom:16px}
.dsec h3{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:0 0 7px}
.masrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;background:#0e1117;margin-bottom:4px;font-size:12.5px}
.masrow.done{background:#131a14}
.masrow b{margin-left:auto}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.link{color:#7dd3fc;cursor:pointer;font-size:12.5px;display:block;padding:2px 0}
.link:hover{text-decoration:underline}
.link.lk{color:#5b6376}
ul.tips{margin:0;padding-left:16px;font-size:12.5px;color:#c2c8d4}
ul.tips li{margin-bottom:4px}
.logbox{display:flex;gap:6px;align-items:center}
.logbox input{flex:1}
.warn{font-size:11.5px;color:#fbbf24;background:#2a220c;border:1px solid #4a3d10;
  padding:8px 10px;border-radius:7px}
.ok{font-size:11.5px;color:#86efac;background:#0f2016;border:1px solid #1e3a26;
  padding:8px 10px;border-radius:7px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;
  background:#f5c542;color:#0b0d12;font-weight:600;padding:9px 16px;border-radius:9px;
  font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#242a36;border-radius:9px}
</style>
</head>
<body>

<header>
  <div class="logo">PROJECT <span>ASCEND</span></div>
  <div class="lvl">
    <div class="lvlbadge" id="lvlNum">1</div>
    <div class="xpwrap">
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
      <div class="xptxt" id="xpTxt">0 XP</div>
    </div>
  </div>
  <div class="hstats">
    <div class="hstat"><b id="sOpen">0</b><span>Açık</span></div>
    <div class="hstat"><b id="sMast">0</b><span>Bronz+</span></div>
    <div class="hstat"><b id="sBoss">0/22</b><span>Boss</span></div>
    <div class="hstat"><b id="sBal">—</b><span>Denge</span></div>
  </div>
  <div class="hbtns">
    <button onclick="exportState()">Dışa aktar</button>
    <button onclick="document.getElementById('imp').click()">İçe al</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importState(this)">
    <button onclick="resetState()">Sıfırla</button>
  </div>
</header>

<main>
  <aside>
    <div class="sec">Ara</div>
    <input type="text" id="q" placeholder="Hareket ara…" oninput="render()">

    <div class="sec">Görünüm</div>
    <label class="chk on"><input type="checkbox" id="fOnlyOpen" onchange="render()"> Sadece açık olanlar</label>
    <label class="chk on"><input type="checkbox" id="fNext" onchange="render()"> Sıradaki hedefler</label>
    <label class="chk on"><input type="checkbox" id="fBoss" onchange="render()"> Sadece boss'lar</label>
    <label class="chk on"><input type="checkbox" id="fEq" onchange="render()"> Ekipmanım yetiyor</label>

    <div class="sec">Ekipmanım</div>
    <div id="eqList"></div>

    <div class="sec">Kategoriler</div>
    <div id="catList"></div>

    <div class="sec">Boss durumu</div>
    <div id="bossList"></div>
  </aside>

  <div id="stage">
    <div id="viewport"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="hint">Sürükle = gez · Tekerlek = yakınlaş · Node'a tıkla = incele</div>
    <div id="zoombtns">
      <button onclick="zoomBy(1.2)">+</button>
      <button onclick="zoomBy(1/1.2)">−</button>
      <button onclick="fitView()">Sığdır</button>
    </div>
  </div>

  <div id="detail"><div class="empty">Bir hareket seç.<br><br>
    Ağaç soldan sağa ilerler: en soldaki sütun hiçbir ön koşulu olmayan
    başlangıç hareketleri, en sağdakiler elit boss'lar.</div></div>
</main>

<div id="toast"></div>

<script>
const D = window.ASCEND_DATA;
const MV = {}; D.moves.forEach(m => MV[m.id] = m);
const MT = D.masteryTiers;                       // ["bronze","silver","gold","master"]
const MEDAL = ["#cd7f32","#c4c9d4","#f5c542","#a855f7"];
const MEDAL_TR = ["Bronz","Gümüş","Altın","Master"];
const DEFAULT_EQ = ["floor","wall","pullup-bar","dip-station","jump-rope","box"];

/* ---------------- durum ---------------- */
// var: test/konsol erisimi icin window uzerinde olsun
var S = load() || {best:{}, xp:0, eq:DEFAULT_EQ.slice(), cats:D.catOrder.slice(), sel:null, gps:null};
window.MVref = id => MV[id];          // test kancasi
function save(){ try{ localStorage.setItem("ascend_v1", JSON.stringify({best:S.best,xp:S.xp,eq:S.eq})); }catch(e){} }
function load(){ try{ const r=localStorage.getItem("ascend_v1"); if(!r) return null;
  const o=JSON.parse(r); return {best:o.best||{},xp:o.xp||0,eq:o.eq||DEFAULT_EQ.slice(),
  cats:D.catOrder.slice(),sel:null,gps:null}; }catch(e){ return null; } }

/* ---------------- kurallar (motor) ---------------- */
// bir hareketin ulasilan mastery kademesi: -1 = yok, 0..3
function tierOf(id){
  const b = S.best[id]; if(b==null) return -1;
  const t = MV[id].mas; let r=-1;
  for(let i=0;i<4;i++) if(b >= t[i][0]) r=i;
  return r;
}
// acik mi: tum on kosullar en az bronz
function isOpen(id){ return MV[id].pr.every(p => tierOf(p) >= 0); }
// ekipman yetiyor mu
function eqOk(id){ const e=MV[id].eq; return e.length===0 || e.some(x=>S.eq.includes(x)); }
// seviye
function levelOf(xp){ let l=1; for(let i=0;i<D.levelCurve.length;i++) if(xp>=D.levelCurve[i]) l=i+1; return l; }
// Denge puani: kazanilan XP'nin kategori dagilimi, o kategorinin
// TOPLAM MEVCUT XP payiyla karsilastirilir.
// Duz 1/N ideali yanlisti: Pull 43 node, Explosive 8 node icerir; esit pay
// beklemek Pull'da ilerleyen kullaniciyi haksiz cezalandiriyordu.
// Bu tanimla: her seyi bitirince puan 100, tek kolda yiginca duser.
function balance(){
  const order=D.catOrder.filter(c=>c!=="recovery");
  const earned={}, avail={}; order.forEach(c=>{earned[c]=0;avail[c]=0;});
  let eTot=0, aTot=0;
  D.moves.forEach(m=>{ if(m.c==="recovery") return;
    const t=tierOf(m.id);
    m.mas.forEach((k,i)=>{ avail[m.c]+=k[1]; aTot+=k[1];
      if(i<=t){ earned[m.c]+=k[1]; eTot+=k[1]; } }); });
  if(eTot===0) return null;
  let dev=0; order.forEach(c=>dev+=Math.abs(earned[c]/eTot - avail[c]/aTot));
  return Math.max(0, Math.round(100*(1-dev/2)));
}
// GPS: bir hedefe giden tum atalar
function ancestors(id){ const s=new Set(), st=[id];
  while(st.length){ const n=st.pop(); MV[n].pr.forEach(p=>{ if(!s.has(p)){s.add(p);st.push(p);} }); }
  return s; }
// sirada ne var: acik ve henuz bronz olmayan, ya da kilitli ama tek adim kalan
function isNext(id){
  const t=tierOf(id);
  if(isOpen(id) && t<0) return true;                       // acik, hic yapilmamis
  if(!isOpen(id)){ const miss=MV[id].pr.filter(p=>tierOf(p)<0); return miss.length===1; }
  return false;
}

/* ---------------- kayit ---------------- */
function logValue(id, val){
  val = Number(val); if(!val || val<=0) return;
  const before = tierOf(id);
  const prev = S.best[id]||0;
  if(val<=prev){ toast("Mevcut en iyi kayıt "+prev+" — daha yüksek bir değer gir."); return; }
  S.best[id]=val;
  const after = tierOf(id);
  let gained=0;
  for(let i=before+1;i<=after;i++) gained += MV[id].mas[i][1];
  if(gained>0){
    const lvlBefore=levelOf(S.xp); S.xp+=gained; const lvlAfter=levelOf(S.xp);
    toast("+"+gained+" XP · "+MEDAL_TR[after]+(lvlAfter>lvlBefore?"  ·  SEVİYE "+lvlAfter+"!":""));
    // yeni acilan node var mi
    if(before<0 && after>=0){
      const opened = MV[id].un.filter(u=>isOpen(u));
      if(opened.length) setTimeout(()=>toast("Kilit açıldı: "+opened.map(u=>MV[u].n).join(", ")),1500);
    }
  } else { toast("Kayıt güncellendi: "+val+" "+MV[id].mu); }
  save(); render(); openDetail(id);
}

/* ---------------- ciz ---------------- */
const svg=document.getElementById("svg");
let scale=0.62, tx=20, ty=10;
function applyT(){ document.getElementById("viewport").style.transform=
  `translate(${tx}px,${ty}px) scale(${scale})`; }

function render(){ drawTree(); updateHud(); }

function drawTree(){
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  const onlyOpen=document.getElementById("fOnlyOpen").checked;
  const onlyNext=document.getElementById("fNext").checked;
  const onlyBoss=document.getElementById("fBoss").checked;
  const eqFilter=document.getElementById("fEq").checked;
  const gpsSet = S.gps ? ancestors(S.gps) : null;

  const vis={};
  D.moves.forEach(m=>{
    let v = S.cats.includes(m.c);
    if(v && onlyOpen) v = isOpen(m.id);
    if(v && onlyNext) v = isNext(m.id);
    if(v && onlyBoss) v = !!m.b;
    if(v && eqFilter) v = eqOk(m.id);
    if(v && q)        v = m.n.toLowerCase().includes(q) || m.mus.join(" ").toLowerCase().includes(q);
    if(v && gpsSet)   v = gpsSet.has(m.id) || m.id===S.gps;
    vis[m.id]=v;
  });

  svg.setAttribute("width", D.canvas.w); svg.setAttribute("height", D.canvas.h);
  let h="";
  // kategori bantlari
  D.catOrder.forEach(c=>{ const b=D.bands[c];
    h+=`<rect class="bandrect" x="0" y="${b.y-14}" width="${D.canvas.w}" height="${b.h+22}" rx="10"/>`;
    h+=`<text class="bandlabel" x="10" y="${b.y-20}">${D.categories[c].label}</text>`; });
  // kenarlar
  D.moves.forEach(m=>{ m.pr.forEach(p=>{ const a=MV[p]; if(!a) return;
    if(!vis[p]||!vis[m.id]) return;
    const x1=a.x+85,y1=a.y,x2=m.x-85,y2=m.y,mx=(x1+x2)/2;
    let cls="edge";
    if(gpsSet && (gpsSet.has(p)||p===S.gps) && (gpsSet.has(m.id)||m.id===S.gps)) cls+=" gps";
    else if(tierOf(p)>=0 && isOpen(m.id)) cls+=" act";
    h+=`<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`; }); });
  // node'lar
  D.moves.forEach(m=>{
    const t=tierOf(m.id), open=isOpen(m.id), col=D.categories[m.c].color;
    let cls="node "+(t>=0?("open m"+t):(open?"open":"locked"));
    if(!vis[m.id]) cls+=" dim";
    if(S.sel===m.id) cls+=" sel";
    if(gpsSet&&(gpsSet.has(m.id)||m.id===S.gps)) cls+=" gps";
    const stroke = t>=0?MEDAL[t]:(open?col:"#242a36");
    const nm = m.n.length>26 ? m.n.slice(0,25)+"…" : m.n;
    h+=`<g class="${cls}" data-id="${m.id}">
      <rect x="${m.x-85}" y="${m.y-15}" width="170" height="30" style="stroke:${stroke}"
        ${m.b?'stroke-width="2.5"':''}/>
      <text x="${m.x-77}" y="${m.y+1}">${m.b?"&#9733; ":""}${esc(nm)}</text>
      <text class="tierbadge" x="${m.x+79}" y="${m.y+1}" text-anchor="end">${t>=0?"&#9679;".repeat(t+1):"T"+m.t}</text>
    </g>`;
  });
  svg.innerHTML=h;
  svg.querySelectorAll(".node").forEach(n=>n.onclick=()=>openDetail(n.dataset.id));
}

function updateHud(){
  // header
  const lvl=levelOf(S.xp), cur=D.levelCurve[lvl-1], nxt=D.levelCurve[lvl]||cur;
  document.getElementById("lvlNum").textContent=lvl;
  document.getElementById("xpFill").style.width=
    (nxt>cur?Math.min(100,100*(S.xp-cur)/(nxt-cur)):100)+"%";
  document.getElementById("xpTxt").textContent=
    S.xp.toLocaleString("tr")+" XP · sonraki seviye "+nxt.toLocaleString("tr");
  document.getElementById("sOpen").textContent=D.moves.filter(m=>isOpen(m.id)).length;
  document.getElementById("sMast").textContent=D.moves.filter(m=>tierOf(m.id)>=0).length;
  const bs=D.moves.filter(m=>m.b);
  document.getElementById("sBoss").textContent=bs.filter(m=>tierOf(m.id)>=0).length+"/"+bs.length;
  const bal=balance(); document.getElementById("sBal").textContent=bal===null?"—":bal;

  renderSidebar(bs);
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderSidebar(bs){
  document.getElementById("eqList").innerHTML = Object.entries(D.equipment).map(([k,v])=>
    `<label class="chk ${S.eq.includes(k)?'on':''}"><input type="checkbox" ${S.eq.includes(k)?'checked':''}
      onchange="toggleEq('${k}')"> ${v}</label>`).join("");
  document.getElementById("catList").innerHTML = D.catOrder.map(c=>{
    const n=D.moves.filter(m=>m.c===c&&tierOf(m.id)>=0).length, tot=D.moves.filter(m=>m.c===c).length;
    return `<label class="chk ${S.cats.includes(c)?'on':''}"><input type="checkbox" ${S.cats.includes(c)?'checked':''}
      onchange="toggleCat('${c}')"><span class="dot" style="background:${D.categories[c].color}"></span>
      ${D.categories[c].label}<span class="catcount">${n}/${tot}</span></label>`; }).join("");
  document.getElementById("bossList").innerHTML = bs.sort((a,b)=>a.t-b.t).map(m=>{
    const t=tierOf(m.id), best=S.best[m.id]||0, tgt=m.mas[0][0];
    const pct=Math.min(100,Math.round(100*best/tgt));
    return `<div style="margin-bottom:7px;cursor:pointer" onclick="openDetail('${m.id}')">
      <div style="display:flex;font-size:11.5px;color:${t>=0?'#86efac':'#8b93a5'}">
        <span>${esc(m.n)}</span><span style="margin-left:auto">${pct}%</span></div>
      <div class="xpbar" style="height:4px;margin-top:2px"><div style="height:100%;width:${pct}%;
        background:${t>=0?'#22c55e':D.categories[m.c].color}"></div></div></div>`; }).join("");
}
function toggleEq(k){ const i=S.eq.indexOf(k); i<0?S.eq.push(k):S.eq.splice(i,1); save(); render(); }
function toggleCat(c){ const i=S.cats.indexOf(c); i<0?S.cats.push(c):S.cats.splice(i,1); render(); }

/* ---------------- detay ---------------- */
function openDetail(id){
  S.sel=id; const m=MV[id], t=tierOf(id), open=isOpen(id), best=S.best[id]||0;
  const missing=m.pr.filter(p=>tierOf(p)<0);
  const fam=D.families[m.f];
  let h=`<div class="dhead"><h2>${m.b?"&#9733; ":""}${esc(m.n)}</h2><div class="dmeta">
    <span class="pill" style="border-color:${D.categories[m.c].color}">${D.categories[m.c].label}</span>
    <span class="pill">Tier ${m.t}</span>
    <span class="pill">${m.ms>1?m.ms+"×":""}${m.mu}</span>
    ${m.b?'<span class="pill" style="border-color:#f5c542;color:#f5c542">BOSS</span>':''}
    ${m.a?'<span class="pill">aksesuar</span>':''}</div></div><div class="dbody">`;

  h+= open
    ? `<div class="dsec"><div class="ok">Açık. ${t>=0?"Ulaşılan kademe: <b>"+MEDAL_TR[t]+"</b> (en iyi: "+best+" "+m.mu+")":"Henüz kayıt yok."}</div></div>`
    : `<div class="dsec"><div class="warn">Kilitli. Eksik ön koşul: ${missing.map(p=>esc(MV[p].n)).join(", ")}</div></div>`;

  h+=`<div class="dsec"><h3>Kayıt gir</h3><div class="logbox">
    <input type="number" id="logv" placeholder="${m.mu}" ${open?"":"disabled"}>
    <button class="pri" onclick="logValue('${id}',document.getElementById('logv').value)"
      ${open?"":"disabled"}>Kaydet</button></div>
    <div style="font-size:11px;color:var(--dim2);margin-top:5px">
      ${m.ms>1?m.ms+" set × ":""}hedef değer · birim: ${m.mu}</div></div>`;

  h+=`<div class="dsec"><h3>Mastery kademeleri</h3>`;
  MT.forEach((k,i)=>{ const done=t>=i;
    h+=`<div class="masrow ${done?'done':''}"><span class="mdot" style="background:${done?MEDAL[i]:'#2a3039'}"></span>
      ${MEDAL_TR[i]} · ${m.mas[i][0]} ${m.mu}<b style="color:${done?MEDAL[i]:'#5b6376'}">${m.mas[i][1]} XP</b></div>`; });
  h+=`</div>`;

  if(m.b){ const pct=Math.min(100,Math.round(100*best/m.mas[0][0]));
    h+=`<div class="dsec"><h3>Boss HP</h3>
      <div class="xpbar" style="height:10px"><div style="height:100%;width:${100-pct}%;background:#ef4444"></div></div>
      <div style="font-size:11.5px;color:var(--dim);margin-top:4px">${100-pct} / 100 HP kaldı</div></div>`; }

  h+=`<div class="dsec"><h3>Ön koşullar (${m.pr.length})</h3>`;
  h+= m.pr.length? m.pr.map(p=>`<span class="link ${tierOf(p)<0?'lk':''}" onclick="openDetail('${p}')">
      ${tierOf(p)>=0?"&#10003;":"&#9675;"} ${esc(MV[p].n)}</span>`).join("")
     : `<div style="font-size:12.5px;color:var(--dim)">Yok — başlangıç hareketi.</div>`;
  h+=`</div>`;

  h+=`<div class="dsec"><h3>Neyin kilidini açar (${m.un.length})</h3>`;
  h+= m.un.length? m.un.map(u=>`<span class="link" onclick="openDetail('${u}')">&rarr; ${esc(MV[u].n)}</span>`).join("")
     : `<div style="font-size:12.5px;color:var(--dim)">Yaprak node${m.b?" — boss":m.a?" — aksesuar/varyasyon":""}.</div>`;
  h+=`</div>`;

  h+=`<div class="dsec"><h3>Yol haritası (Skill GPS)</h3>
    <button onclick="setGps('${id}')">${S.gps===id?"Yolu gizle":"Bu hedefe giden yolu göster"}</button>
    <div style="font-size:11.5px;color:var(--dim);margin-top:5px">
      ${ancestors(id).size} ön hareket · ağaç derinliği ${m.d}</div></div>`;

  h+=`<div class="dsec"><h3>Ekipman</h3><div class="dmeta">${
    m.eq.length? m.eq.map(e=>`<span class="pill">${D.equipment[e]}</span>`).join("")
      : '<span class="pill">gerekmez</span>'}</div></div>`;
  h+=`<div class="dsec"><h3>Çalışan bölgeler</h3><div class="dmeta">${
    m.mus.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div>`;
  h+=`<div class="dsec"><h3>İpuçları</h3><ul class="tips">${
    fam.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h+=`<div class="dsec"><h3>Sık hatalar</h3><ul class="tips">${
    fam.mistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h+=`</div>`;
  document.getElementById("detail").innerHTML=h;
  drawTree();            // secim vurgusunu ve GPS yolunu guncelle
}
function setGps(id){ S.gps = S.gps===id?null:id; openDetail(id); }

/* ---------------- gez / yakinlas ---------------- */
const stage=document.getElementById("stage");
let dragging=false,sx=0,sy=0;
stage.addEventListener("mousedown",e=>{ if(e.target.closest(".node"))return;
  dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;stage.classList.add("drag"); });
window.addEventListener("mousemove",e=>{ if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; applyT(); });
window.addEventListener("mouseup",()=>{ dragging=false;stage.classList.remove("drag"); });
stage.addEventListener("wheel",e=>{ e.preventDefault();
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12, ns=Math.max(0.18,Math.min(2.2,scale*f));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; applyT(); },{passive:false});
function zoomBy(f){ scale=Math.max(0.18,Math.min(2.2,scale*f)); applyT(); }
function fitView(){ const r=stage.getBoundingClientRect();
  scale=Math.min(r.width/D.canvas.w, r.height/D.canvas.h)*0.95;
  tx=(r.width-D.canvas.w*scale)/2; ty=(r.height-D.canvas.h*scale)/2; applyT(); }

/* ---------------- yardimcilar ---------------- */
let tt;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg;
  t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600); }
function exportState(){
  const blob=new Blob([JSON.stringify({v:1,best:S.best,xp:S.xp,eq:S.eq,date:new Date().toISOString()},null,1)],
    {type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="ascend_ilerleme_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  toast("İlerleme dosyası indirildi."); }
function importState(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); S.best=o.best||{}; S.xp=o.xp||0;
    if(o.eq)S.eq=o.eq; save(); render(); toast("İlerleme yüklendi."); }
    catch(e){ toast("Dosya okunamadı."); } }; r.readAsText(f); inp.value=""; }
function resetState(){ if(!confirm("Tüm ilerleme silinecek. Emin misin?"))return;
  S.best={};S.xp=0;S.gps=null;S.sel=null;save();render();
  document.getElementById("detail").innerHTML='<div class="empty">Sıfırlandı. Bir hareket seç.</div>'; }

render(); fitView();
</script>
</body>
</html>
